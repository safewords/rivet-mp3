name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: ubuntu-latest }
          - { name: linux arm64,    os: ubuntu-24.04-arm }
          - { name: windows x86-64, os: windows-latest }
          - { name: macos arm64,    os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Robustness with overflow checks (debug)
        run: cargo test --test robustness

  # The decoder against ISO's conformance waveforms. The data is ISO's and
  # not in the repository; this job fetches the part it needs (~45 MB) from
  # ISO's public ISO/IEC 14496-26 package and runs the comparison.
  conformance:
    name: ISO conformance sequences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: conformance
          key: iso-14496-26-ed2-mpeg12
      - name: Fetch the conformance data
        run: python3 tools/fetch_conformance.py conformance
      - name: Compare
        run: cargo test --release --test conformance -- --nocapture
        env:
          MP3_CONFORMANCE_DIR: conformance

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
