[package]
name = "rivet-mp3"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-mp3"
homepage = "https://github.com/safewords/rivet-mp3"
documentation = "https://docs.rs/rivet-mp3"
authors = ["Ely Erin Fox"]
description = "An MPEG audio decoder (Layers I, II and III; MPEG-1, MPEG-2 LSF and MPEG-2.5) and an MP3 (Layer III) encoder in Rust, written from ISO/IEC 11172-3 and 13818-3: no C, no system libraries, no build script. Xing/Info/LAME and VBRI headers with gapless delay and padding. rivet's MP3 codec. Imported as `mp3`."
keywords = ["mp3", "mpeg", "audio", "decoder", "encoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/", "docs/", "tools/"]

[lib]
name = "mp3"

[dependencies]
thiserror = "2"

[features]
default = []
